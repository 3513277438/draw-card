<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五色词库 · 纯黑版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            touch-action: none;
        }
        .app {
            width: 100%;
            max-width: 420px;
            background: #1a1a1a;
            border-radius: 32px;
            padding: 24px 20px 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            transition: box-shadow 0.3s ease;
            touch-action: manipulation;
            position: relative;
            overflow: hidden;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .lib-name {
            font-size: 20px;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: 0.5px;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.3s ease;
        }
        .dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a3a5a;
            transition: background 0.3s ease, transform 0.2s ease;
            cursor: pointer;
        }
        .dot.active {
            background: #e94560;
            transform: scale(1.25);
        }
        .card {
            background: #222;
            border-radius: 24px;
            padding: 30px 16px 24px;
            min-height: 170px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: border 0.3s ease;
            touch-action: manipulation;
            cursor: pointer;
        }
        .word {
            font-size: 42px;
            font-weight: 700;
            color: #f0f0f0;
            user-select: none;
            -webkit-user-select: none;
        }
        .meaning {
            font-size: 20px;
            color: #8892b0;
            margin-top: 12px;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .meaning.show {
            opacity: 1;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            border: none;
            border-radius: 60px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-width: 80px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #e94560;
        }
        .btn-secondary {
            background: #2a3a5e;
        }
        .btn-success {
            background: #1a7a5a;
        }
        .add-area {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .add-area input {
            flex: 1;
            min-width: 100px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #2a3a5e;
            background: #111;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border 0.3s ease;
            touch-action: manipulation;
        }
        .add-area input:focus {
            border-color: #e94560;
        }
        .list-area {
            margin-top: 16px;
            max-height: 170px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 6px;
            border-left: 4px solid #e94560;
            transition: border 0.3s ease;
            touch-action: manipulation;
        }
        .list-item .w {
            color: #f0f0f0;
            font-weight: 500;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-item .m {
            color: #8892b0;
            font-size: 14px;
            margin-left: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-item .del {
            background: none;
            border: none;
            color: #b3384a;
            font-size: 20px;
            cursor: pointer;
            padding: 0 6px;
            touch-action: manipulation;
        }
        .counter {
            color: #5a6a8a;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            user-select: none;
            -webkit-user-select: none;
        }
        .hint {
            color: #3a4a6a;
            font-size: 12px;
            text-align: center;
            margin-top: 4px;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-area::-webkit-scrollbar {
            width: 4px;
        }
        .list-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .list-area::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 10px;
        }
        .swipe-hint {
            text-align: center;
            font-size: 13px;
            color: #4a4a6a;
            margin-top: 8px;
            letter-spacing: 0.3px;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <div class="lib-name" id="libName">猎兽黑红</div>
        <div class="dots" id="dots"></div>
    </div>

    <div class="card" id="cardArea">
        <div class="word" id="wordDisplay">🎲</div>
        <div class="meaning" id="meaningDisplay">点「抽」开始</div>
    </div>

    <div class="btn-group">
        <button class="btn btn-primary" id="drawBtn">🎲 抽</button>
        <button class="btn btn-secondary" id="revealBtn">👁 释义</button>
    </div>

    <div class="add-area">
        <input id="wordInput" placeholder="英文" maxlength="50">
        <input id="meaningInput" placeholder="释义" maxlength="50">
        <button class="btn btn-success" id="addBtn" style="flex:0.6;min-width:60px">➕</button>
    </div>

    <div class="list-area" id="listArea"></div>

    <div class="counter" id="counter">共 0 个词 · 已抽 0 次</div>
    <div class="hint">✕ 删除 · 左右滑动切换词库</div>
    <div class="swipe-hint" id="swipeHint">← 滑动切换 →</div>
</div>

<script>
(function() {
    const LIBRARIES = [
        { id: 'hunter', name: '猎兽黑红', accent: '#e94560' },
        { id: 'sunset', name: '夕彩赤黄', accent: '#f59e0b' },
        { id: 'forest', name: '荫萌翠绿', accent: '#10b981' },
        { id: 'sky', name: '碧空蔚蓝', accent: '#3b82f6' },
        { id: 'violet', name: '罗兰紫色', accent: '#a855f7' }
    ];

    const STORAGE_KEY = 'five_libraries_data';

    function loadAllData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length === LIBRARIES.length) {
                    return LIBRARIES.map((lib, idx) => {
                        const saved = parsed[idx] || {};
                        return { ...lib, words: Array.isArray(saved.words) ? saved.words : [] };
                    });
                }
            }
        } catch (_) {}
        return LIBRARIES.map((lib, idx) => ({
            ...lib,
            words: idx === 0 ? [
                { word: 'apple', meaning: '苹果' },
                { word: 'book', meaning: '书' },
                { word: 'cat', meaning: '猫' }
            ] : [
                { word: 'sample', meaning: '示例' },
                { word: 'test', meaning: '测试' }
            ]
        }));
    }

    function saveAllData(libs) {
        const toSave = libs.map(lib => ({ id: lib.id, name: lib.name, words: lib.words || [] }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    let libraries = loadAllData();
    let currentIndex = 0;
    let currentWord = null;
    let drawCount = 0;
    let lastDrawnIndex = -1;

    const app = document.getElementById('app');
    const libName = document.getElementById('libName');
    const dots = document.getElementById('dots');
    const cardArea = document.getElementById('cardArea');
    const wordEl = document.getElementById('wordDisplay');
    const meaningEl = document.getElementById('meaningDisplay');
    const listEl = document.getElementById('listArea');
    const counterEl = document.getElementById('counter');
    const wordInput = document.getElementById('wordInput');
    const meaningInput = document.getElementById('meaningInput');
    const swipeHint = document.getElementById('swipeHint');

    function getCurrentLib() {
        return libraries[currentIndex] || libraries[0];
    }

    function applyTheme(lib) {
        const accent = lib.accent;
        libName.style.color = '#f0f0f0';
        cardArea.style.border = '1px solid ' + accent + '44';
        document.querySelector('.btn-primary').style.background = accent;
        document.querySelectorAll('.list-item').forEach(el => {
            el.style.borderLeftColor = accent;
        });
        document.querySelectorAll('.dot').forEach((dot, i) => {
            dot.style.background = i === currentIndex ? accent : '#3a3a5a';
        });
        libName.textContent = lib.name;
        swipeHint.textContent = (currentIndex === 0) ? '→ 滑动切换' :
                                (currentIndex === libraries.length - 1) ? '← 滑动切换' :
                                '← 滑动切换 →';
    }

    function renderDots() {
        let html = '';
        libraries.forEach((_, i) => {
            html += `<div class="dot ${i === currentIndex ? 'active' : ''}" data-index="${i}"></div>`;
        });
        dots.innerHTML = html;
        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', function() {
                const idx = parseInt(this.getAttribute('data-index'), 10);
                if (!isNaN(idx) && idx !== currentIndex) goToLibrary(idx);
            });
        });
    }

    function goToLibrary(index) {
        if (index < 0 || index >= libraries.length) return;
        currentIndex = index;
        const lib = getCurrentLib();
        applyTheme(lib);
        renderDots();
        currentWord = null;
        drawCount = 0;
        renderList();
        updateCounter();
        drawCard();
        try { localStorage.setItem('current_lib_index', String(currentIndex)); } catch (_) {}
    }

    function drawCard() {
        const lib = getCurrentLib();
        const words = lib.words || [];
        if (words.length === 0) {
            wordEl.textContent = '📭';
            meaningEl.textContent = '词库为空，添加新词吧';
            meaningEl.className = 'meaning';
            currentWord = null;
            return;
        }
        let idx;
        if (words.length === 1) {
            idx = 0;
        } else {
            let attempts = 0;
            do {
                idx = Math.floor(Math.random() * words.length);
                attempts++;
            } while (idx === lastDrawnIndex && attempts < 20);
        }
        lastDrawnIndex = idx;
        currentWord = words[idx];
        wordEl.textContent = currentWord.word;
        meaningEl.textContent = currentWord.meaning;
        meaningEl.className = 'meaning';
        drawCount++;
        updateCounter();
        wordEl.style.transition = 'none';
        wordEl.style.opacity = '0.6';
        setTimeout(() => {
            wordEl.style.transition = 'opacity 0.15s ease';
            wordEl.style.opacity = '1';
        }, 10);
    }

    function revealMeaning() {
        if (currentWord) {
            meaningEl.className = 'meaning show';
        } else {
            drawCard();
            setTimeout(() => { meaningEl.className = 'meaning show'; }, 200);
        }
    }

    function addWord() {
        const w = wordInput.value.trim();
        const m = meaningInput.value.trim();
        if (!w || !m) { alert('请输入英文和释义'); return; }
        const lib = getCurrentLib();
        if (lib.words.some(item => item.word.toLowerCase() === w.toLowerCase())) {
            alert('这个词已存在');
            return;
        }
        lib.words.push({ word: w, meaning: m });
        saveAllData(libraries);
        wordInput.value = '';
        meaningInput.value = '';
        renderList();
        updateCounter();
        drawCard();
    }

    function deleteWord(index) {
        const lib = getCurrentLib();
        if (index < 0 || index >= lib.words.length) return;
        if (confirm('删除 "' + lib.words[index].word + '" ？')) {
            lib.words.splice(index, 1);
            saveAllData(libraries);
            renderList();
            updateCounter();
            if (lib.words.length > 0) drawCard();
            else {
                wordEl.textContent = '📭';
                meaningEl.textContent = '词库为空，添加新词吧';
                meaningEl.className = 'meaning';
                currentWord = null;
            }
        }
    }

    function renderList() {
        const lib = getCurrentLib();
        const words = lib.words || [];
        if (words.length === 0) {
            listEl.innerHTML = '<div style="color:#4a5a7a;text-align:center;padding:16px;font-size:14px">还没有词，添加一些吧</div>';
            return;
        }
        let html = '';
        words.forEach((item, i) => {
            html += `<div class="list-item" style="border-left-color:${lib.accent};">
                <span><span class="w">${esc(item.word)}</span><span class="m">${esc(item.meaning)}</span></span>
                <button class="del" data-index="${i}">✕</button>
            </div>`;
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.del').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const idx = parseInt(this.getAttribute('data-index'), 10);
                if (!isNaN(idx)) deleteWord(idx);
            });
        });
    }

    function updateCounter() {
        const lib = getCurrentLib();
        const count = (lib.words || []).length;
        counterEl.textContent = `共 ${count} 个词 · 已抽 ${drawCount} 次`;
    }

    function esc(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // 手势滑动
    let touchStartX = 0, touchStartY = 0;
    app.addEventListener('touchstart', function(e) {
        const touch = e.touches[0];
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
    }, { passive: true });

    app.addEventListener('touchmove', function(e) {
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - touchStartX;
        const deltaY = touch.clientY - touchStartY;
        if (Math.abs(deltaX) > 20 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
            e.preventDefault();
            if (deltaX < -40 && currentIndex < libraries.length - 1) {
                goToLibrary(currentIndex + 1);
                touchStartX = touch.clientX;
            } else if (deltaX > 40 && currentIndex > 0) {
                goToLibrary(currentIndex - 1);
                touchStartX = touch.clientX;
            }
        }
    }, { passive: false });

    // 锁缩放
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(e) {
        if (e.target.closest('.list-area')) return;
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    function init() {
        try {
            const savedIdx = localStorage.getItem('current_lib_index');
            if (savedIdx !== null) {
                const idx = parseInt(savedIdx, 10);
                if (!isNaN(idx) && idx >= 0 && idx < libraries.length) currentIndex = idx;
            }
        } catch (_) {}
        renderDots();
        goToLibrary(currentIndex);
        document.getElementById('drawBtn').addEventListener('click', drawCard);
        document.getElementById('revealBtn').addEventListener('click', revealMeaning);
        document.getElementById('addBtn').addEventListener('click', addWord);
        cardArea.addEventListener('click', revealMeaning);
        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); meaningInput.focus(); }
        });
        meaningInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); addWord(); }
        });
    }

    init();
})();
</script>
</body>
</html>
