<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五色词库 · 划走版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0a0a;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            overflow: hidden;
            touch-action: none;
        }
        .app-wrapper {
            width: 100%;
            max-width: 420px;
            position: relative;
            overflow: hidden;
            border-radius: 32px;
            touch-action: none;
        }
        .app-slider {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            touch-action: none;
        }
        .app-page {
            flex: 0 0 100%;
            padding: 24px 20px 30px;
            background: #1a1a1a;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            overflow: hidden;
            touch-action: none;
            min-height: 560px;
        }
        .glow {
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            transition: background 0.6s ease, opacity 0.6s ease;
            pointer-events: none;
            z-index: 0;
        }
        .glow-bottom {
            position: absolute;
            bottom: -80px;
            left: -80px;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.15;
            transition: background 0.6s ease, opacity 0.6s ease;
            pointer-events: none;
            z-index: 0;
        }
        .header, .card, .btn-group, .add-area, .list-area, .counter, .hint, .swipe-hint {
            position: relative;
            z-index: 1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .lib-name {
            font-size: 20px;
            font-weight: 700;
            color: #f0f0f0;
            letter-spacing: 0.5px;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.3s ease;
        }
        .dots {
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3a3a5a;
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            transform: scale(1.25);
            box-shadow: 0 0 12px currentColor;
        }
        .card {
            background: #222;
            border-radius: 24px;
            padding: 30px 16px 24px;
            min-height: 170px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: border 0.3s ease, box-shadow 0.4s ease;
            touch-action: manipulation;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }
        .word {
            font-size: 42px;
            font-weight: 700;
            color: #f0f0f0;
            user-select: none;
            -webkit-user-select: none;
            text-shadow: 0 0 20px rgba(255,255,255,0.05);
        }
        .meaning {
            font-size: 20px;
            color: #8892b0;
            margin-top: 12px;
            min-height: 30px;
            opacity: 0;
            transition: opacity 0.3s ease, color 0.3s ease, text-shadow 0.3s ease;
            user-select: none;
            -webkit-user-select: none;
        }
        .meaning.show {
            opacity: 1;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn {
            flex: 1;
            border: none;
            border-radius: 60px;
            padding: 14px 16px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.1s ease, box-shadow 0.3s ease;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            min-width: 80px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.3);
        }
        .btn-secondary {
            background: #2a3a5e;
        }
        .btn-success {
            background: #1a7a5a;
        }
        .add-area {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .add-area input {
            flex: 1;
            min-width: 100px;
            padding: 12px 14px;
            border-radius: 14px;
            border: 1px solid #2a3a5e;
            background: #111;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            touch-action: manipulation;
        }
        .add-area input:focus {
            border-color: #e94560;
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.15);
        }
        .list-area {
            margin-top: 16px;
            max-height: 170px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            margin-bottom: 6px;
            border-left: 4px solid #e94560;
            transition: border 0.3s ease, box-shadow 0.3s ease;
            touch-action: manipulation;
        }
        .list-item .w {
            color: #f0f0f0;
            font-weight: 500;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-item .m {
            color: #8892b0;
            font-size: 14px;
            margin-left: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-item .del {
            background: none;
            border: none;
            color: #b3384a;
            font-size: 20px;
            cursor: pointer;
            padding: 0 6px;
            touch-action: manipulation;
        }
        .counter {
            color: #5a6a8a;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            user-select: none;
            -webkit-user-select: none;
        }
        .hint {
            color: #3a4a6a;
            font-size: 12px;
            text-align: center;
            margin-top: 4px;
            user-select: none;
            -webkit-user-select: none;
        }
        .list-area::-webkit-scrollbar {
            width: 4px;
        }
        .list-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .list-area::-webkit-scrollbar-thumb {
            background: #3a3a5a;
            border-radius: 10px;
        }
        .swipe-hint {
            text-align: center;
            font-size: 13px;
            color: #4a4a6a;
            margin-top: 8px;
            letter-spacing: 0.3px;
            user-select: none;
            -webkit-user-select: none;
            transition: color 0.3s ease;
        }
        /* 切换中禁用点击 */
        .is-swiping .btn,
        .is-swiping .dot,
        .is-swiping .list-item .del,
        .is-swiping .add-area input,
        .is-swiping .add-area button {
            pointer-events: none;
        }
    </style>
</head>
<body>
<div class="app-wrapper" id="appWrapper">
    <div class="app-slider" id="appSlider">
        <!-- 由 JavaScript 动态生成五个页面 -->
    </div>
</div>

<script>
(function() {
    // ============================================================
    // 1. 词库配置
    // ============================================================
    const LIBRARIES = [
        { id: 'hunter', name: '猎兽黑红', accent: '#e94560', glow: 'rgba(233, 69, 96, 0.5)' },
        { id: 'sunset', name: '夕彩赤黄', accent: '#f59e0b', glow: 'rgba(245, 158, 11, 0.5)' },
        { id: 'forest', name: '荫萌翠绿', accent: '#10b981', glow: 'rgba(16, 185, 129, 0.5)' },
        { id: 'sky', name: '碧空蔚蓝', accent: '#3b82f6', glow: 'rgba(59, 130, 246, 0.5)' },
        { id: 'violet', name: '罗兰紫色', accent: '#a855f7', glow: 'rgba(168, 85, 247, 0.5)' }
    ];

    const STORAGE_KEY = 'five_libraries_data';

    // ============================================================
    // 2. 数据管理
    // ============================================================
    function loadAllData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed) && parsed.length === LIBRARIES.length) {
                    return LIBRARIES.map((lib, idx) => {
                        const saved = parsed[idx] || {};
                        return { ...lib, words: Array.isArray(saved.words) ? saved.words : [] };
                    });
                }
            }
        } catch (_) {}
        return LIBRARIES.map((lib, idx) => ({
            ...lib,
            words: idx === 0 ? [
                { word: 'apple', meaning: '苹果' },
                { word: 'book', meaning: '书' },
                { word: 'cat', meaning: '猫' }
            ] : [
                { word: 'sample', meaning: '示例' },
                { word: 'test', meaning: '测试' }
            ]
        }));
    }

    function saveAllData(libs) {
        const toSave = libs.map(lib => ({ id: lib.id, name: lib.name, words: lib.words || [] }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
    }

    let libraries = loadAllData();
    let currentIndex = 0;
    let lastDrawnMap = {};
    let drawCountMap = {};

    // ============================================================
    // 3. DOM 构建
    // ============================================================
    const slider = document.getElementById('appSlider');
    const wrapper = document.getElementById('appWrapper');
    const pageRefs = [];

    function buildPages() {
        slider.innerHTML = '';
        pageRefs.length = 0;
        libraries.forEach((lib, idx) => {
            const page = document.createElement('div');
            page.className = 'app-page';
            page.dataset.index = idx;
            page.innerHTML = `
                <div class="glow" id="glowTop-${idx}"></div>
                <div class="glow-bottom" id="glowBottom-${idx}"></div>
                <div class="header">
                    <div class="lib-name" id="libName-${idx}">${lib.name}</div>
                    <div class="dots" id="dots-${idx}"></div>
                </div>
                <div class="card" id="cardArea-${idx}">
                    <div class="word" id="wordDisplay-${idx}">🎲</div>
                    <div class="meaning" id="meaningDisplay-${idx}">点「抽」开始</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="drawBtn-${idx}">🎲 抽</button>
                    <button class="btn btn-secondary" id="revealBtn-${idx}">👁 释义</button>
                </div>
                <div class="add-area">
                    <input id="wordInput-${idx}" placeholder="英文" maxlength="50">
                    <input id="meaningInput-${idx}" placeholder="释义" maxlength="50">
                    <button class="btn btn-success" id="addBtn-${idx}" style="flex:0.6;min-width:60px">➕</button>
                </div>
                <div class="list-area" id="listArea-${idx}"></div>
                <div class="counter" id="counter-${idx}">共 0 个词 · 已抽 0 次</div>
                <div class="hint">✕ 删除 · 左右滑动切换词库</div>
                <div class="swipe-hint" id="swipeHint-${idx}">← 滑动切换 →</div>
            `;
            slider.appendChild(page);
            pageRefs.push(page);
        });
        libraries.forEach((lib, idx) => {
            if (!lastDrawnMap[lib.id]) lastDrawnMap[lib.id] = -1;
            if (!drawCountMap[lib.id]) drawCountMap[lib.id] = 0;
            const page = pageRefs[idx];
            page._lib = lib;
            page._idx = idx;
            page._glowTop = page.querySelector(`#glowTop-${idx}`);
            page._glowBottom = page.querySelector(`#glowBottom-${idx}`);
            page._libName = page.querySelector(`#libName-${idx}`);
            page._dots = page.querySelector(`#dots-${idx}`);
            page._cardArea = page.querySelector(`#cardArea-${idx}`);
            page._word = page.querySelector(`#wordDisplay-${idx}`);
            page._meaning = page.querySelector(`#meaningDisplay-${idx}`);
            page._list = page.querySelector(`#listArea-${idx}`);
            page._counter = page.querySelector(`#counter-${idx}`);
            page._wordInput = page.querySelector(`#wordInput-${idx}`);
            page._meaningInput = page.querySelector(`#meaningInput-${idx}`);
            page._drawBtn = page.querySelector(`#drawBtn-${idx}`);
            page._revealBtn = page.querySelector(`#revealBtn-${idx}`);
            page._addBtn = page.querySelector(`#addBtn-${idx}`);
            page._swipeHint = page.querySelector(`#swipeHint-${idx}`);
            applyThemeToPage(page, lib, idx);
            renderDotsForPage(page, lib, idx);
            renderListForPage(page, lib, idx);
            updateCounterForPage(page, lib, idx);
            drawCardForPage(page, lib, idx);
            bindPageEvents(page, lib, idx);
        });
        goToLibrary(currentIndex, false);
    }

    // ============================================================
    // 4. 主题应用
    // ============================================================
    function applyThemeToPage(page, lib, idx) {
        const accent = lib.accent;
        const glow = lib.glow;
        page._glowTop.style.background = `radial-gradient(circle, ${glow}, transparent 70%)`;
        page._glowBottom.style.background = `radial-gradient(circle, ${glow}, transparent 70%)`;
        page._glowTop.style.opacity = '0.35';
        page._glowBottom.style.opacity = '0.2';
        page._libName.style.color = '#f0f0f0';
        page._cardArea.style.border = `1px solid ${accent}55`;
        page._cardArea.style.boxShadow = `0 0 40px ${accent}22, inset 0 0 30px ${accent}11`;
        page._drawBtn.style.background = accent;
        page._drawBtn.style.boxShadow = `0 0 30px ${accent}44`;
        const total = libraries.length;
        const hint = (idx === 0) ? '→ 滑动切换' :
                     (idx === total - 1) ? '← 滑动切换' :
                     '← 滑动切换 →';
        page._swipeHint.textContent = hint;
        page._swipeHint.style.color = `${accent}77`;
    }

    function renderDotsForPage(page, lib, idx) {
        const container = page._dots;
        let html = '';
        libraries.forEach((_, i) => {
            const active = (i === idx) ? 'active' : '';
            html += `<div class="dot ${active}" data-index="${i}" data-pageidx="${idx}"></div>`;
        });
        container.innerHTML = html;
        container.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', function(e) {
                e.stopPropagation();
                const targetIdx = parseInt(this.getAttribute('data-index'), 10);
                if (!isNaN(targetIdx) && targetIdx !== currentIndex) {
                    goToLibrary(targetIdx, true);
                }
            });
        });
        container.querySelectorAll('.dot').forEach((dot, i) => {
            const accent = libraries[i].accent;
            dot.style.color = accent;
            if (i === idx) {
                dot.style.background = accent;
                dot.style.boxShadow = `0 0 16px ${accent}66`;
            } else {
                dot.style.background = '#3a3a5a';
                dot.style.boxShadow = 'none';
            }
        });
    }

    function renderListForPage(page, lib, idx) {
        const words = lib.words || [];
        const container = page._list;
        const accent = lib.accent;
        if (words.length === 0) {
            container.innerHTML = '<div style="color:#4a5a7a;text-align:center;padding:16px;font-size:14px">还没有词，添加一些吧</div>';
            return;
        }
        let html = '';
        words.forEach((item, i) => {
            html += `<div class="list-item" style="border-left-color:${accent};">
                <span><span class="w">${esc(item.word)}</span><span class="m">${esc(item.meaning)}</span></span>
                <button class="del" data-index="${i}" data-pageidx="${idx}">✕</button>
            </div>`;
        });
        container.innerHTML = html;
        container.querySelectorAll('.del').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const wordIdx = parseInt(this.getAttribute('data-index'), 10);
                const pageIdx = parseInt(this.getAttribute('data-pageidx'), 10);
                if (!isNaN(wordIdx) && !isNaN(pageIdx)) {
                    deleteWord(pageIdx, wordIdx);
                }
            });
        });
    }

    function updateCounterForPage(page, lib, idx) {
        const count = (lib.words || []).length;
        const drawn = drawCountMap[lib.id] || 0;
        page._counter.textContent = `共 ${count} 个词 · 已抽 ${drawn} 次`;
    }

    function drawCardForPage(page, lib, idx) {
        const words = lib.words || [];
        const wordEl = page._word;
        const meaningEl = page._meaning;
        if (words.length === 0) {
            wordEl.textContent = '📭';
            meaningEl.textContent = '词库为空，添加新词吧';
            meaningEl.className = 'meaning';
            return;
        }
        let wordIdx;
        const lastIdx = lastDrawnMap[lib.id] ?? -1;
        if (words.length === 1) {
            wordIdx = 0;
        } else {
            let attempts = 0;
            do {
                wordIdx = Math.floor(Math.random() * words.length);
                attempts++;
            } while (wordIdx === lastIdx && attempts < 20);
        }
        lastDrawnMap[lib.id] = wordIdx;
        const word = words[wordIdx];
        wordEl.textContent = word.word;
        meaningEl.textContent = word.meaning;
        meaningEl.className = 'meaning';
        drawCountMap[lib.id] = (drawCountMap[lib.id] || 0) + 1;
        updateCounterForPage(page, lib, idx);
        wordEl.style.transition = 'none';
        wordEl.style.opacity = '0.6';
        setTimeout(() => {
            wordEl.style.transition = 'opacity 0.15s ease';
            wordEl.style.opacity = '1';
        }, 10);
        saveAllData(libraries);
    }

    // ============================================================
    // 5. 事件绑定
    // ============================================================
    function bindPageEvents(page, lib, idx) {
        page._drawBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            drawCardForPage(page, lib, idx);
        });
        page._revealBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const meaningEl = page._meaning;
            const wordEl = page._word;
            if (meaningEl.classList.contains('show')) {
                meaningEl.classList.remove('show');
            } else {
                if (wordEl.textContent === '🎲' || wordEl.textContent === '📭') {
                    drawCardForPage(page, lib, idx);
                    setTimeout(() => { meaningEl.classList.add('show'); }, 200);
                } else {
                    meaningEl.classList.add('show');
                }
            }
        });
        page._cardArea.addEventListener('click', function(e) {
            e.stopPropagation();
            const meaningEl = page._meaning;
            const wordEl = page._word;
            if (meaningEl.classList.contains('show')) {
                meaningEl.classList.remove('show');
            } else {
                if (wordEl.textContent === '🎲' || wordEl.textContent === '📭') {
                    drawCardForPage(page, lib, idx);
                    setTimeout(() => { meaningEl.classList.add('show'); }, 200);
                } else {
                    meaningEl.classList.add('show');
                }
            }
        });
        page._addBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const w = page._wordInput.value.trim();
            const m = page._meaningInput.value.trim();
            if (!w || !m) { alert('请输入英文和释义'); return; }
            if (lib.words.some(item => item.word.toLowerCase() === w.toLowerCase())) {
                alert('这个词已存在');
                return;
            }
            lib.words.push({ word: w, meaning: m });
            saveAllData(libraries);
            page._wordInput.value = '';
            page._meaningInput.value = '';
            renderListForPage(page, lib, idx);
            updateCounterForPage(page, lib, idx);
            drawCardForPage(page, lib, idx);
        });
        page._wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                page._meaningInput.focus();
            }
        });
        page._meaningInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                page._addBtn.click();
            }
        });
    }

    // ============================================================
    // 6. 删除词
    // ============================================================
    function deleteWord(pageIdx, wordIdx) {
        const lib = libraries[pageIdx];
        if (!lib) return;
        if (wordIdx < 0 || wordIdx >= lib.words.length) return;
        if (confirm('删除 "' + lib.words[wordIdx].word + '" ？')) {
            lib.words.splice(wordIdx, 1);
            saveAllData(libraries);
            const page = pageRefs[pageIdx];
            if (page) {
                renderListForPage(page, lib, pageIdx);
                updateCounterForPage(page, lib, pageIdx);
                if (lib.words.length > 0) {
                    drawCardForPage(page, lib, pageIdx);
                } else {
                    page._word.textContent = '📭';
                    page._meaning.textContent = '词库为空，添加新词吧';
                    page._meaning.className = 'meaning';
                }
            }
        }
    }

    // ============================================================
    // 7. 切换词库（无回弹，自然划出）
    // ============================================================
    let isAnimating = false;

    function goToLibrary(index, animate = true) {
        if (isAnimating) return;
        if (index < 0) index = 0;
        if (index >= libraries.length) index = libraries.length - 1;
        if (index === currentIndex) {
            slider.style.transition = animate ? 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
            slider.style.transform = `translateX(-${index * 100}%)`;
            if (!animate) slider.style.transition = 'none';
            return;
        }
        isAnimating = true;
        currentIndex = index;
        slider.style.transition = animate ? 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)' : 'none';
        slider.style.transform = `translateX(-${index * 100}%)`;
        // 更新指示点
        pageRefs.forEach((page, idx) => {
            const dots = page._dots;
            if (dots) {
                dots.querySelectorAll('.dot').forEach((dot, i) => {
                    const accent = libraries[i].accent;
                    if (i === currentIndex) {
                        dot.classList.add('active');
                        dot.style.background = accent;
                        dot.style.boxShadow = `0 0 16px ${accent}66`;
                    } else {
                        dot.classList.remove('active');
                        dot.style.background = '#3a3a5a';
                        dot.style.boxShadow = 'none';
                    }
                });
            }
        });
        try { localStorage.setItem('current_lib_index', String(currentIndex)); } catch (_) {}
        setTimeout(() => {
            isAnimating = false;
        }, 550);
    }

    // ============================================================
    // 8. 手势滑动（像划出屏幕一样自然）
    // ============================================================
    let startX = 0;
    let startY = 0;
    let startIndex = 0;
    let isSwiping = false;

    wrapper.addEventListener('touchstart', function(e) {
        if (isAnimating) return;
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        startIndex = currentIndex;
        isSwiping = false;
        slider.style.transition = 'none';
    }, { passive: true });

    wrapper.addEventListener('touchmove', function(e) {
        if (isAnimating) return;
        if (e.touches.length !== 1) return;
        const touch = e.touches[0];
        const deltaX = touch.clientX - startX;
        const deltaY = touch.clientY - startY;
        if (Math.abs(deltaX) > 15 && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
            e.preventDefault();
            isSwiping = true;
            const percent = (deltaX / wrapper.offsetWidth) * 100;
            let newPercent = -startIndex * 100 + percent;
            if (newPercent > 0) newPercent = 0;
            if (newPercent < -(libraries.length - 1) * 100) newPercent = -(libraries.length - 1) * 100;
            slider.style.transform = `translateX(${newPercent}%)`;
        }
    }, { passive: false });

    wrapper.addEventListener('touchend', function(e) {
        if (!isSwiping || isAnimating) return;
        const deltaX = e.changedTouches[0].clientX - startX;
        const threshold = wrapper.offsetWidth * 0.2;
        let targetIndex = startIndex;
        if (deltaX < -threshold && startIndex < libraries.length - 1) {
            targetIndex = startIndex + 1;
        } else if (deltaX > threshold && startIndex > 0) {
            targetIndex = startIndex - 1;
        }
        goToLibrary(targetIndex, true);
        isSwiping = false;
    }, { passive: true });

    // ============================================================
    // 9. 辅助
    // ============================================================
    function esc(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    document.addEventListener('touchmove', function(e) {
        if (e.target.closest('.list-area')) return;
        if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });

    // ============================================================
    // 10. 初始化
    // ============================================================
    function init() {
        try {
            const savedIdx = localStorage.getItem('current_lib_index');
            if (savedIdx !== null) {
                const idx = parseInt(savedIdx, 10);
                if (!isNaN(idx) && idx >= 0 && idx < libraries.length) currentIndex = idx;
            }
        } catch (_) {}
        buildPages();
        slider.style.transition = 'none';
        slider.style.transform = `translateX(-${currentIndex * 100}%)`;
        setTimeout(() => {
            slider.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
        }, 50);
    }

    init();
})();
</script>
</body>
