<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>果园 · 日果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            background: #0f0f1a;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e8eef5;
        }
        .app {
            max-width: 440px;
            width: 100%;
            background: #1a1a2e;
            border-radius: 36px;
            padding: 24px 18px 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
            border: 1px solid #2a2a4a;
        }
        /* 标题 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 6px;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #e8eef5;
        }
        .header .date-badge {
            font-size: 14px;
            background: #2a2a4a;
            padding: 6px 16px;
            border-radius: 30px;
            color: #8aaccc;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ===== 选择页 ===== */
        .fruit-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 12px 0 18px;
        }
        .fruit-card {
            background: #1e1e3a;
            border-radius: 18px;
            padding: 12px 4px 10px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
            position: relative;
        }
        .fruit-card:active { transform: scale(0.95); }
        .fruit-card .icon {
            font-size: 34px;
            line-height: 1.2;
        }
        .fruit-card .label {
            font-size: 11px;
            color: #8aaccc;
            margin-top: 2px;
            font-weight: 500;
        }
        .fruit-card .status {
            font-size: 9px;
            color: #5a7a9a;
            margin-top: 2px;
        }
        .fruit-card.selected {
            border-color: #6a9ec8;
            background: #1e2a4a;
            box-shadow: 0 0 20px rgba(100, 160, 220, 0.15);
        }
        .fruit-card.locked {
            opacity: 0.45;
            pointer-events: none;
        }
        .fruit-card .check-mark {
            position: absolute;
            top: -6px;
            right: -6px;
            background: #4a8a6a;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            line-height: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* ===== 种植页 ===== */
        .grow-area {
            background: #12122a;
            border-radius: 24px;
            padding: 16px 12px 18px;
            margin: 6px 0 14px;
            border: 1px solid #2a2a4a;
            text-align: center;
        }
        .grow-area .big-fruit {
            font-size: 72px;
            line-height: 1.1;
            margin: 4px 0;
        }
        .grow-area .stage-label {
            font-size: 16px;
            font-weight: 500;
            color: #b0c8dd;
            margin-top: 2px;
        }
        .grow-area .progress-text {
            font-size: 13px;
            color: #6a8aaa;
            margin-top: 4px;
        }
        .grow-area .timer-display {
            font-size: 40px;
            font-weight: 300;
            letter-spacing: 2px;
            color: #e8f0f8;
            margin: 8px 0 6px;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #2a2a4a;
            border-radius: 10px;
            margin: 8px 0 12px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #6a9ec8;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 12px 26px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
            min-width: 80px;
            touch-action: manipulation;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .btn:active { transform: scale(0.94); }
        .btn-start { background: #3a7db0; }
        .btn-start:active { background: #2a6b9e; }
        .btn-pause { background: #b8a040; }
        .btn-pause:active { background: #9a8830; }
        .btn-done { background: #4a8a6a; }
        .btn-done:active { background: #3a7a5a; }
        .btn-reset { background: #5a3a4a; }
        .btn-reset:active { background: #4a2a3a; }
        .btn:disabled { opacity: 0.35; pointer-events: none; }

        /* ===== 统计版 ===== */
        .stats-section {
            margin-top: 20px;
            border-top: 1px solid #2a2a4a;
            padding-top: 16px;
        }
        .stats-title {
            font-size: 14px;
            font-weight: 500;
            color: #6a8aaa;
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .stats-cell {
            background: #12122a;
            border-radius: 10px;
            padding: 8px 2px;
            text-align: center;
            aspect-ratio: 1 / 1.05;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 1px solid #1e1e3a;
            transition: all 0.2s ease;
        }
        .stats-cell .s-icon {
            font-size: 26px;
            line-height: 1.1;
        }
        .stats-cell .s-date {
            font-size: 9px;
            color: #5a7a9a;
            margin-top: 2px;
            font-weight: 500;
        }
        .stats-cell .s-name {
            font-size: 8px;
            color: #8aaccc;
            margin-top: 1px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .stats-cell.empty {
            opacity: 0.2;
        }
        .stats-cell .s-duration {
            font-size: 8px;
            color: #4a6a8a;
            margin-top: 1px;
        }

        .no-stats {
            color: #4a6a8a;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
            font-style: italic;
        }

        /* ===== 命名弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 24px;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a2e;
            border-radius: 32px;
            padding: 32px 24px 28px;
            max-width: 360px;
            width: 100%;
            border: 1px solid #2a2a4a;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }
        .modal .m-icon { font-size: 56px; display: block; margin-bottom: 8px; }
        .modal .m-title { font-size: 20px; font-weight: 600; color: #e8eef5; margin-bottom: 4px; }
        .modal .m-sub { font-size: 14px; color: #8aaccc; margin-bottom: 16px; }
        .modal input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid #2a3a5e;
            background: #0f0f1a;
            color: #e8eef5;
            font-size: 16px;
            outline: none;
            text-align: center;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
        .modal input:focus { border-color: #6a9ec8; }
        .modal .m-btn-group {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .modal .m-btn {
            flex: 1;
            border: none;
            border-radius: 60px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
            touch-action: manipulation;
        }
        .modal .m-btn:active { transform: scale(0.95); }
        .modal .m-btn.confirm { background: #4a8a6a; }
        .modal .m-btn.confirm:active { background: #3a7a5a; }
        .modal .m-btn.cancel { background: #5a3a4a; }
        .modal .m-btn.cancel:active { background: #4a2a3a; }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #3a5a7a;
            margin-top: 16px;
            letter-spacing: 0.3px;
        }

        @media (max-width: 420px) {
            .fruit-card .icon { font-size: 28px; }
            .grow-area .big-fruit { font-size: 56px; }
            .grow-area .timer-display { font-size: 32px; }
            .btn { font-size: 13px; padding: 10px 18px; }
            .stats-cell .s-icon { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <!-- 头部 -->
    <div class="header">
        <h1>🌳 日果</h1>
        <span class="date-badge" id="todayBadge"></span>
    </div>

    <!-- 水果选择区 -->
    <div class="fruit-grid" id="fruitGrid"></div>

    <!-- 种植区 -->
    <div class="grow-area" id="growArea">
        <div class="big-fruit" id="bigFruit">🌱</div>
        <div class="stage-label" id="stageLabel">等待开始</div>
        <div class="progress-text" id="progressText">0 / 5 小时</div>
        <div class="timer-display" id="timerDisplay">00:00:00</div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="btn-group">
            <button class="btn btn-start" id="startBtn">▶ 开始</button>
            <button class="btn btn-pause" id="pauseBtn" disabled>⏸ 暂停</button>
            <button class="btn btn-done" id="doneBtn" disabled>✔ 完毕</button>
        </div>
    </div>

    <!-- 统计版 -->
    <div class="stats-section">
        <div class="stats-title">📋 果园日记</div>
        <div class="stats-grid" id="statsGrid"></div>
    </div>

    <div class="footer-note">每天一种 · 五小时成熟 · 种下即成长</div>
</div>

<!-- ===== 命名弹窗 ===== -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <span class="m-icon" id="modalIcon">🍎</span>
        <div class="m-title" id="modalTitle">果实成熟了！</div>
        <div class="m-sub" id="modalSub">给它起个名字吧</div>
        <input type="text" id="modalInput" placeholder="输入名字..." maxlength="20" autocomplete="off">
        <div class="m-btn-group">
            <button class="m-btn cancel" id="modalCancel">跳过</button>
            <button class="m-btn confirm" id="modalConfirm">✔ 命名</button>
        </div>
    </div>
</div>

<script>
    // ================================================================
    // 1. 水果配置
    // ================================================================
    const FRUITS = [
        { id: 'apple',  emoji: '🍎', name: '苹果', color: '#e84a4a' },
        { id: 'pear',   emoji: '🍐', name: '雪梨', color: '#c8b84a' },
        { id: 'orange', emoji: '🍊', name: '橙子', color: '#f0a030' },
        { id: 'peach',  emoji: '🍑', name: '蜜桃', color: '#f0a0a0' },
        { id: 'strawberry', emoji: '🍓', name: '草莓', color: '#e84a4a' }
    ];

    // 成长阶段 (0~5)
    const STAGES = [
        { label: '种子', emoji: '🌱', min: 0 },
        { label: '青涩', emoji: '🌿', min: 0.5 },
        { label: '半熟', emoji: '🌱', min: 1 },
        { label: '饱满', emoji: '🌳', min: 2 },
        { label: '鲜艳', emoji: '🌳', min: 3 },
        { label: '成熟', emoji: '🎉', min: 5 }
    ];

    // ================================================================
    // 2. 存储
    // ================================================================
    const STORAGE_KEY = 'orchard_data';

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const d = JSON.parse(raw);
                // 确保有 stats 数组
                if (!d.stats) d.stats = [];
                return d;
            }
        } catch (_) {}
        return {
            // 当前种植状态
            currentFruit: null,        // 'apple' 等
            startTime: null,           // 时间戳 (毫秒)
            accumulated: 0,            // 已累计秒数
            isPaused: true,
            isDone: false,
            // 今日是否已种
            todayFruit: null,          // 今天种了什么水果
            todayDate: null,           // '2026-08-06'
            // 统计版
            stats: []                  // { date, fruitId, name, duration, stage }
        };
    }

    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ================================================================
    // 3. 工具
    // ================================================================
    function getToday() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function formatDate(dateStr) {
        const parts = dateStr.split('-');
        return parts[1] + '/' + parts[2];
    }

    function formatDuration(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    }

    function getStage(seconds) {
        const hours = seconds / 3600;
        for (let i = STAGES.length - 1; i >= 0; i--) {
            if (hours >= STAGES[i].min) return i;
        }
        return 0;
    }

    function getStageLabel(seconds) {
        const idx = getStage(seconds);
        return STAGES[idx].label + ' · ' + (seconds/3600).toFixed(1) + 'h';
    }

    function getStageEmoji(seconds) {
        const idx = getStage(seconds);
        return STAGES[idx].emoji;
    }

    function getFruitById(id) {
        return FRUITS.find(f => f.id === id);
    }

    // ================================================================
    // 4. 主逻辑
    // ================================================================
    let data = loadData();
    let timerInterval = null;
    let isRunning = false;
    let pendingFruitId = null; // 用于弹窗

    const today = getToday();

    // ---- DOM 引用 ----
    const fruitGrid = document.getElementById('fruitGrid');
    const bigFruit = document.getElementById('bigFruit');
    const stageLabel = document.getElementById('stageLabel');
    const progressText = document.getElementById('progressText');
    const timerDisplay = document.getElementById('timerDisplay');
    const progressFill = document.getElementById('progressFill');
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const doneBtn = document.getElementById('doneBtn');
    const statsGrid = document.getElementById('statsGrid');
    const todayBadge = document.getElementById('todayBadge');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalIcon = document.getElementById('modalIcon');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const modalInput = document.getElementById('modalInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');

    // ---- 初始化 ----
    function init() {
        // 检查是否新的一天
        if (data.todayDate !== today) {
            // 新的一天，重置今日种植状态
            data.todayFruit = null;
            data.todayDate = today;
            // 如果有未完成的种植，且未完成，保留？按照设计，跨天不保留，但数据还在。
            // 我们保留 currentFruit 但标记为过期？
            // 策略：如果跨天且当前有未完成的水果，我们仍保留它，但今天不能再选新的。
            // 但实际上：只要今天还没种，就可以选。
            // 如果 data.todayFruit 为空，则允许选择。
            // 如果 data.currentFruit 存在但 todayFruit 为空，说明是旧数据，我们清理掉。
            if (!data.todayFruit) {
                // 重置当前种植
                data.currentFruit = null;
                data.startTime = null;
                data.accumulated = 0;
                data.isPaused = true;
                data.isDone = false;
            }
            saveData(data);
        }

        // 如果今天已经种了，锁定选择
        renderFruitGrid();
        renderStats();
        updateGrowArea();
        updateTimerDisplay();
        updateProgress();
        todayBadge.textContent = formatDate(today);

        // 如果当前有种植且未完成，恢复计时
        if (data.currentFruit && !data.isDone) {
            // 计算已流逝时间
            if (!data.isPaused && data.startTime) {
                const elapsed = (Date.now() - data.startTime) / 1000;
                data.accumulated += elapsed;
                data.startTime = Date.now();
                saveData(data);
            }
            // 检查是否超过5小时
            checkCompletion();
            updateGrowArea();
        }
    }

    // ---- 渲染水果选择 ----
    function renderFruitGrid() {
        fruitGrid.innerHTML = '';
        const todayLocked = data.todayFruit !== null;
        FRUITS.forEach(f => {
            const card = document.createElement('div');
            card.className = 'fruit-card';
            if (data.currentFruit === f.id && !data.isDone) {
                card.classList.add('selected');
            }
            if (todayLocked && data.todayFruit !== f.id) {
                card.classList.add('locked');
            }
            // 如果今天已经种了这个水果且已完成，显示勾
            const isTodayDone = data.stats.some(s => s.date === today && s.fruitId === f.id);
            card.innerHTML = `
                <div class="icon">${f.emoji}</div>
                <div class="label">${f.name}</div>
                <div class="status">${isTodayDone ? '✅ 已收' : ''}</div>
                ${isTodayDone ? '<div class="check-mark">✓</div>' : ''}
            `;
            if (!todayLocked || data.todayFruit === f.id) {
                card.addEventListener('click', () => selectFruit(f.id));
            }
            fruitGrid.appendChild(card);
        });
    }

    function selectFruit(id) {
        if (data.isDone) return;
        if (data.todayFruit && data.todayFruit !== id) {
            // 今天已经种了别的水果
            return;
        }
        // 如果当前正在种植，切换水果会丢失进度，需要确认
        if (data.currentFruit && data.currentFruit !== id && data.accumulated > 0) {
            if (!confirm('切换水果将丢失当前进度，确定吗？')) return;
        }
        // 重置当前种植
        data.currentFruit = id;
        data.startTime = null;
        data.accumulated = 0;
        data.isPaused = true;
        data.isDone = false;
        data.todayFruit = id;
        data.todayDate = today;
        saveData(data);
        renderFruitGrid();
        updateGrowArea();
        updateTimerDisplay();
        updateProgress();
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = '▶ 开始';
        pauseBtn.disabled = true;
        doneBtn.disabled = true;
    }

    // ---- 种植区更新 ----
    function updateGrowArea() {
        if (!data.currentFruit || data.isDone) {
            const fruit = data.currentFruit ? getFruitById(data.currentFruit) : null;
            if (data.isDone && fruit) {
                bigFruit.textContent = fruit.emoji;
                stageLabel.textContent = '✅ 已收获';
                progressText.textContent = '5 / 5 小时';
            } else {
                bigFruit.textContent = '🌱';
                stageLabel.textContent = '选择一种水果开始';
                progressText.textContent = '0 / 5 小时';
            }
            return;
        }
        const fruit = getFruitById(data.currentFruit);
        if (!fruit) return;
        const seconds = data.accumulated;
        const stageIdx = getStage(seconds);
        bigFruit.textContent = fruit.emoji;
        stageLabel.textContent = STAGES[stageIdx].label + ' · ' + (seconds/3600).toFixed(1) + 'h';
        progressText.textContent = Math.min(seconds/3600, 5).toFixed(1) + ' / 5 小时';
        // 如果已满5小时
        if (seconds >= 5 * 3600) {
            stageLabel.textContent = '🎉 成熟了！';
            progressText.textContent = '5 / 5 小时';
        }
    }

    function updateTimerDisplay() {
        if (!data.currentFruit || data.isDone) {
            timerDisplay.textContent = '00:00:00';
            return;
        }
        let seconds = data.accumulated;
        if (!data.isPaused && data.startTime) {
            seconds += (Date.now() - data.startTime) / 1000;
        }
        if (seconds > 5 * 3600) seconds = 5 * 3600;
        timerDisplay.textContent = formatDuration(Math.floor(seconds));
    }

    function updateProgress() {
        if (!data.currentFruit || data.isDone) {
            progressFill.style.width = '0%';
            return;
        }
        let seconds = data.accumulated;
        if (!data.isPaused && data.startTime) {
            seconds += (Date.now() - data.startTime) / 1000;
        }
        const pct = Math.min((seconds / (5 * 3600)) * 100, 100);
        progressFill.style.width = pct + '%';
    }

    // ---- 计时控制 ----
    function startTimer() {
        if (!data.currentFruit || data.isDone) return;
        if (data.accumulated >= 5 * 3600) {
            // 已满，触发完成
            completeFruit();
            return;
        }
        if (!data.isPaused) return;
        data.isPaused = false;
        data.startTime = Date.now();
        saveData(data);
        isRunning = true;
        startBtn.textContent = '⏳ 生长中';
        startBtn.disabled = true;
        pauseBtn.disabled = false;
        doneBtn.disabled = false;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            updateTimerDisplay();
            updateProgress();
            updateGrowArea();
            // 检查是否满5小时
            let sec = data.accumulated;
            if (!data.isPaused && data.startTime) {
                sec += (Date.now() - data.startTime) / 1000;
            }
            if (sec >= 5 * 3600) {
                clearInterval(timerInterval);
                isRunning = false;
                completeFruit();
            }
        }, 500);
    }

    function pauseTimer() {
        if (!data.currentFruit || data.isDone) return;
        if (data.isPaused) return;
        // 累计时间
        if (data.startTime) {
            data.accumulated += (Date.now() - data.startTime) / 1000;
            data.startTime = null;
        }
        data.isPaused = true;
        saveData(data);
        isRunning = false;
        clearInterval(timerInterval);
        startBtn.textContent = '▶ 继续';
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        updateTimerDisplay();
        updateProgress();
        updateGrowArea();
    }

    function resetTimer() {
        if (!data.currentFruit) return;
        if (data.accumulated === 0 && data.isPaused) {
            // 没开始过，直接重置选择
            data.currentFruit = null;
            data.todayFruit = null;
            saveData(data);
            renderFruitGrid();
            updateGrowArea();
            updateTimerDisplay();
            updateProgress();
            return;
        }
        if (!confirm('重置将丢失当前进度，确定吗？')) return;
        clearInterval(timerInterval);
        isRunning = false;
        data.accumulated = 0;
        data.startTime = null;
        data.isPaused = true;
        data.isDone = false;
        saveData(data);
        startBtn.textContent = '▶ 开始';
        startBtn.disabled = false;
        pauseBtn.disabled = true;
        doneBtn.disabled = true;
        updateGrowArea();
        updateTimerDisplay();
        updateProgress();
    }

    // ---- 完成 ----
    function completeFruit() {
        if (!data.currentFruit) return;
        if (data.isDone) return;
        // 确保累计时间达到5小时
        if (data.accumulated < 5 * 3600) {
            // 补足
            data.accumulated = 5 * 3600;
        }
        data.isDone = true;
        data.isPaused = true;
        data.startTime = null;
        clearInterval(timerInterval);
        isRunning = false;
        saveData(data);

        // 弹出命名窗口
        const fruit = getFruitById(data.currentFruit);
        modalIcon.textContent = fruit.emoji;
        modalTitle.textContent = '🎉 果实成熟了！';
        modalSub.textContent = '给它起一个名字吧';
        modalInput.value = '';
        modalInput.placeholder = '输入名字...';
        pendingFruitId = data.currentFruit;
        modalOverlay.classList.add('show');
        setTimeout(() => modalInput.focus(), 300);
        // 按钮状态
        startBtn.textContent = '▶ 开始';
        startBtn.disabled = true;
        pauseBtn.disabled = true;
        doneBtn.disabled = true;
    }

    function confirmName() {
        const name = modalInput.value.trim() || '无名果';
        if (pendingFruitId) {
            // 记录到统计
            const record = {
                date: today,
                fruitId: pendingFruitId,
                name: name,
                duration: Math.floor(data.accumulated),
                stage: 5
            };
            // 检查今天是否已有记录，防止重复
            const existing = data.stats.some(s => s.date === today && s.fruitId === pendingFruitId);
            if (!existing) {
                data.stats.push(record);
                saveData(data);
            }
            // 重置种植状态
            data.currentFruit = null;
            data.todayFruit = null;
            data.accumulated = 0;
            data.startTime = null;
            data.isPaused = true;
            data.isDone = false;
            data.todayDate = today;
            saveData(data);
            pendingFruitId = null;
            modalOverlay.classList.remove('show');
            renderFruitGrid();
            renderStats();
            updateGrowArea();
            updateTimerDisplay();
            updateProgress();
            startBtn.textContent = '▶ 开始';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            doneBtn.disabled = true;
        }
    }

    function cancelName() {
        // 跳过命名，使用默认名
        if (pendingFruitId) {
            const record = {
                date: today,
                fruitId: pendingFruitId,
                name: '无名果',
                duration: Math.floor(data.accumulated),
                stage: 5
            };
            const existing = data.stats.some(s => s.date === today && s.fruitId === pendingFruitId);
            if (!existing) {
                data.stats.push(record);
                saveData(data);
            }
            data.currentFruit = null;
            data.todayFruit = null;
            data.accumulated = 0;
            data.startTime = null;
            data.isPaused = true;
            data.isDone = false;
            data.todayDate = today;
            saveData(data);
            pendingFruitId = null;
            modalOverlay.classList.remove('show');
            renderFruitGrid();
            renderStats();
            updateGrowArea();
            updateTimerDisplay();
            updateProgress();
            startBtn.textContent = '▶ 开始';
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            doneBtn.disabled = true;
        }
    }

    // ---- 检查是否已完成 ----
    function checkCompletion() {
        if (!data.currentFruit) return;
        if (data.isDone) return;
        if (data.accumulated >= 5 * 3600) {
            completeFruit();
        }
    }

    // ---- 统计版 ----
    function renderStats() {
        const sorted = [...data.stats].reverse(); // 最新在前
        if (sorted.length === 0) {
            statsGrid.innerHTML = '<div class="no-stats" style="grid-column:1/-1;">还没有收获，去种一颗吧</div>';
            return;
        }
        let html = '';
        sorted.forEach(record => {
            const fruit = getFruitById(record.fruitId);
            const emoji = fruit ? fruit.emoji : '🍎';
            const dateStr = formatDate(record.date);
            const dur = record.duration || 0;
            const durStr = Math.floor(dur/3600) + 'h' + Math.floor((dur%3600)/60) + 'm';
            html += `
                <div class="stats-cell">
                    <div class="s-icon">${emoji}</div>
                    <div class="s-date">${dateStr}</div>
                    <div class="s-name">${record.name || '无名'}</div>
                    <div class="s-duration">${durStr}</div>
                </div>
            `;
        });
        statsGrid.innerHTML = html;
    }

    // ---- 事件绑定 ----
    startBtn.addEventListener('click', startTimer);
    pauseBtn.addEventListener('click', pauseTimer);
    doneBtn.addEventListener('click', function() {
        if (!data.currentFruit || data.isDone) return;
        // 手动完成：不管多久，确认后写名字
        if (data.accumulated < 0.5 * 3600) {
            if (!confirm('才种了不到半小时，确定要收获吗？')) return;
        }
        // 锁定当前进度
        data.isDone = true;
        data.isPaused = true;
        data.startTime = null;
        clearInterval(timerInterval);
        isRunning = false;
        saveData(data);
        const fruit = getFruitById(data.currentFruit);
        modalIcon.textContent = fruit.emoji;
        modalTitle.textContent = '🌱 收获时刻';
        modalSub.textContent = '给它起一个名字吧';
        modalInput.value = '';
        modalInput.placeholder = '输入名字...';
        pendingFruitId = data.currentFruit;
        modalOverlay.classList.add('show');
        setTimeout(() => modalInput.focus(), 300);
        startBtn.textContent = '▶ 开始';
        startBtn.disabled = true;
        pauseBtn.disabled = true;
        doneBtn.disabled = true;
    });

    modalConfirm.addEventListener('click', confirmName);
    modalCancel.addEventListener('click', cancelName);
    modalInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmName();
        if (e.key === 'Escape') cancelName();
    });

    // 点击外部关闭弹窗（但不触发确认）
    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) {
            // 不关闭，必须通过按钮
        }
    });

    // ---- 恢复计时器循环 ----
    function tickLoop() {
        if (!data.currentFruit || data.isDone) return;
        if (!data.isPaused) {
            updateTimerDisplay();
            updateProgress();
            updateGrowArea();
            // 检查是否满5小时
            let sec = data.accumulated;
            if (!data.isPaused && data.startTime) {
                sec += (Date.now() - data.startTime) / 1000;
            }
            if (sec >= 5 * 3600) {
                clearInterval(timerInterval);
                isRunning = false;
                completeFruit();
            }
        }
        requestAnimationFrame(tickLoop);
    }

    // ---- 启动 ----
    init();
    // 启动一个低频率的更新循环
    setInterval(() => {
        if (!data.isPaused && data.currentFruit && !data.isDone) {
            updateTimerDisplay();
            updateProgress();
            updateGrowArea();
        }
    }, 1000);

    // 保存数据到localStorage的辅助函数（覆盖）
    // 确保每次修改都保存
    console.log('🌳 果园已加载，今天：' + today);
</script>
</body>
</html>
